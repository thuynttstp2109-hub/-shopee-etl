# Databricks Asset Bundle: triển khai notebook + tạo Lakeflow Job bằng một lệnh.
#   databricks bundle deploy       # đưa code lên workspace và tạo job
#   databricks bundle run shopee_daily_etl
# Không khai báo cluster: job chạy trên compute serverless (Free Edition chỉ có serverless).

bundle:
  name: shopee-etl

resources:
  jobs:
    shopee_daily_etl:
      name: shopee_daily_etl
      max_concurrent_runs: 1
      schedule:
        quartz_cron_expression: "0 0 7 * * ?"   # 7h sáng mỗi ngày
        timezone_id: Asia/Ho_Chi_Minh
        pause_status: PAUSED                     # bật trong giao diện Jobs khi sẵn sàng
      parameters:
        - name: mode                             # mock | api | files
          default: mock
      tasks:
        - task_key: extract_bronze
          notebook_task:
            notebook_path: ./databricks/01_extract_bronze.py
        - task_key: silver
          depends_on:
            - task_key: extract_bronze
          notebook_task:
            notebook_path: ./databricks/02_silver.py
            base_parameters:
              snapshot_date: "{{tasks.extract_bronze.values.snapshot_date}}"
        - task_key: gold
          depends_on:
            - task_key: silver
          notebook_task:
            notebook_path: ./databricks/03_gold.py
            base_parameters:
              snapshot_date: "{{tasks.extract_bronze.values.snapshot_date}}"

targets:
  dev:
    mode: development
    default: true
